<!DOCTYPE html>
<html lang="zh-Hant">
<head>

      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .title-wrap { min-width: 0; line-height: 1.15; }
    .app-title {

    .sync-dot {

    .topbar-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn-sm {

      font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 2px;
    }
    .btn-share { background: #10b981; color: #fff; }

    .btn-edit.active { background: #16a34a; border-color: #16a34a; }
    .btn-next { background: #f97316; color: #fff; }
    .nav-dropdown {

      background: #fff; border-radius: 10px; box-shadow: 0 8px 20px rgba(15,23,42,0.2);
      border: 1px solid var(--border); padding: 4px; z-index: 2000; display: none;
    }
    .nav-dropdown.open { display: block; }
    .nav-item {

    .nav-item-inner { display: inline-flex; align-items: center; gap: 7px; }
    .cal-date-icon {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 4px; overflow: hidden;
      border: 1px solid #cbd5e1; background: #fff; flex-shrink: 0; line-height: 1;
    }
    .cal-date-top { width: 100%; height: 5px; background: #0284c7; display: block; }
    .cal-date-num {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px;
    }
    .map-schedule-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .map-box {

      background: #bae6fd; transition: height 0.22s ease;
    }
    .map-box.expanded {
      height: 44%;
    }
    #map { width: 100%; height: 100%; }
    .map-float-btn {
      position: absolute; top: 8px; right: 8px; z-index: 800;
      background: rgba(255,255,255,0.94); border: 1px solid #cbd5e1; border-radius: 14px;
      padding: 4px 10px; font-size: 12px; font-weight: 700; color: #0f172a; cursor: pointer;
    }
    .pick-banner {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 800;
      background: #dc2626; color: #fff; padding: 5px 12px; border-radius: 14px;
      font-size: 12px; font-weight: 700; display: none; white-space: nowrap;
    }
    .pick-banner.show { display: block; }
    .list-box {
      height: 73%; flex: 1; overflow-y: auto; padding: 10px 12px 22px;
      background: #f8fafc; -webkit-overflow-scrolling: touch;
    }
    .plan-switch-bar {
      display: flex; gap: 6px; margin-bottom: 10px; background: #e2e8f0; padding: 4px; border-radius: 10px;
    }
    .plan-btn {
      flex: 1; padding: 7px 6px; border: none; border-radius: 8px; font-size: 13px; font-weight: 800;
      cursor: pointer; background: transparent; color: #475569; letter-spacing: 0.2px;
    }
    .plan-btn.active { background: #fff; color: #0369a1; box-shadow: 0 1px 3px rgba(15,23,42,0.1); }
    .phase-divider {
      background: linear-gradient(90deg, #e0f2fe 0%, #f0f9ff 100%);
      color: #0369a1; font-size: 13px; font-weight: 800; letter-spacing: 0.3px;
      padding: 6px 11px; border-radius: 8px; margin: 12px 0 8px; border-left: 4px solid #0284c7;
    }
    .phase-divider:first-child { margin-top: 2px; }
    .stop-card {
      background: #fff; border-radius: 11px; padding: 11px 12px; margin-bottom: 8px;
      border: 1px solid #e2e8f0; cursor: pointer;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .stop-card.current {
      border: 2px solid #f97316; background: #fff7ed;
      box-shadow: 0 3px 10px rgba(249,115,22,0.12);
    }
    .stop-card.done-stop { border-color: #e2e8f0; background: #f8fafc; opacity: 0.82; }
    .stop-card.collapsed { padding: 8px 12px; margin-bottom: 6px; }
    .stop-card.collapsed .stop-title { font-size: 14px; color: #475569; }
    .collapse-btn {
      background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 7px;
      padding: 4px 8px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .collapse-btn.active { background: #0284c7; border-color: #0284c7; color: #fff; }
    .right-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stop-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .stop-main { flex: 1; min-width: 0; }
    .stop-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 5px; }
    .time-badge {
      background: #0f172a; color: #fff; font-size: 12px; font-weight: 700;
      padding: 2px 8px; border-radius: 6px; letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }
    .group-badge { font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
    .group-a { background: #dbeafe; color: #1d4ed8; }
    .group-b { background: #dcfce7; color: #15803d; }
    .stop-title {
      font-size: 15.5px; font-weight: 800; color: #0f172a; line-height: 1.4;
      letter-spacing: 0.2px; word-break: break-word;
    }
    .stop-note {
      font-size: 13.5px; color: #334155; margin-top: 6px; padding-top: 6px;
      border-top: 1px dashed #e2e8f0; line-height: 1.55; letter-spacing: 0.15px;
      white-space: pre-line; word-break: break-word;
    }
    .nav-go-btn {
      background: #0284c7; color: #fff; border: none; border-radius: 7px;
      padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
      text-decoration: none; display: inline-block;
    }
    .info-page { flex: 1; overflow-y: auto; padding: 12px; display: none; background: #f8fafc; }
    .info-page.active { display: block; }
    .info-card {
      background: #fff; border-radius: 11px; padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .info-time {
      display: inline-block; background: #e0f2fe; color: #0369a1;
      font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px;
    }
    .info-title { font-size: 15.5px; font-weight: 800; color: #0f172a; line-height: 1.4; margin-bottom: 6px; }
    .info-body {
      font-size: 13.5px; color: #334155; line-height: 1.6; letter-spacing: 0.15px;
      padding-top: 6px; border-top: 1px dashed #e2e8f0; white-space: pre-line;
    }
    .edit-row { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .edit-input, .edit-textarea {
      width: 100%; padding: 8px 10px; border: 1.5px solid #94a3b8; border-radius: 8px;
      font-size: 15px; font-family: inherit; background: #fff;
    }
    .edit-textarea { min-height: 64px; resize: vertical; }
    .edit-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .mini-btn {
      padding: 6px 10px; border-radius: 7px; border: 1px solid #cbd5e1; background: #f1f5f9;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .mini-btn.pin { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .mini-btn.del { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }
    .add-item-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: 2px dashed #0284c7;
      background: #e0f2fe; color: #0369a1; font-size: 15px; font-weight: 800; cursor: pointer;
      margin-top: 6px;
    }
    .toast {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 13.5px; font-weight: 700; z-index: 3000; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 4000;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 320px; background: #fff; border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center;
    }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .modal-desc { font-size: 14px; color: #64748b; margin-bottom: 14px; }
    .pin-input {
      width: 100%; padding: 11px; font-size: 20px; text-align: center; letter-spacing: 6px;
      border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 8px;
    }
    .pin-err { color: #dc2626; font-size: 13.5px; font-weight: 700; min-height: 20px; margin-bottom: 10px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .modal-cancel { background: #e2e8f0; color: #334155; }
    .modal-confirm { background: #0284c7; color: #fff; }
    .share-url-box {
      width: 100%; padding: 9px 10px; font-size: 16px; color: #0f172a;
      background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: 9px;
      margin-bottom: 10px; text-align: left;
    }
    .share-actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .share-action-btn {
      width: 100%; padding: 10px; border-radius: 10px; border: none;
      font-size: 14.5px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none;
    }
    .share-line { background: #06c755; color: #fff; }
    .share-copy { background: #0284c7; color: #fff; }
    .num-pin {
      width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2.5px solid #0284c7;
      color: #0f172a; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }
    .num-pin.done { background: #cbd5e1; border-color: #64748b; color: #475569; }
    .turtle-wrap { position: relative; display: flex; align-items: center; }
    .turtle-badge {
      width: 59px; height: 58px; background: transparent; border: none; border-radius: 0;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.35)); animation: bob 1.6s ease-in-out infinite;
    }
    .turtle-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .turtle-label {
      margin-left: 5px; background: #0f172a; color: #fff; font-size: 12px; font-weight: 800;
      padding: 3px 8px; border-radius: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .island-text-label {
      background: transparent; border: none; color: #0369a1; font-size: 11px; font-weight: 800;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuToggleBtn" aria-label="切換分頁">☰</button>
        <div class="title-wrap">
          <div class="app-title">
            <span class="sync-dot" id="syncDot" title="本機模式"></span>
            <span>趣小琉球Hi三天兩夜</span>
          </div>

        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-sm btn-share" id="shareBtn" title="分享行程給朋友">📤 分享</button>

        <button class="btn-sm btn-next" id="nextStopBtn">下一站 ➔</button>

    </header>

    <div class="nav-dropdown" id="navDropdown" role="menu">
      <button class="nav-item" data-view="notes">📋 注意事項</button>
      <button class="nav-item" data-view="departure">🚄 當天出發時間排程</button>
      <button class="nav-item active" data-view="day1"><span class="nav-item-inner"><span class="cal-date-icon"><span class="cal-date-top"></span><span class="cal-date-num">19</span></span><span>day1時間排程</span></span></button>
      <button class="nav-item" data-view="day2"><span class="nav-item-inner"><span class="cal-date-icon"><span class="cal-date-top"></span><span class="cal-date-num">20</span></span><span>day2時間排程</span></span></button>
      <button class="nav-item" data-view="day3"><span class="nav-item-inner"><span class="cal-date-icon"><span class="cal-date-top"></span><span class="cal-date-num">21</span></span><span>day3時間排程</span></span></button>

        <div id="map"></div>
        <div style="position:absolute; top:8px; right:8px; z-index:800; display:flex; gap:5px;">
          <button class="map-float-btn" style="position:static;" id="toggleMapSizeBtn">↕️ 放大地圖</button>
          <button class="map-float-btn" style="position:static;" id="fitIslandBtn">🏝️ 全島視角</button>

      </div>
      <div class="list-box" id="scheduleListContainer"></div>

    <div class="info-page" id="infoPageContainer"></div>
  </div>

  <div class="toast" id="toastMsg">已儲存並同步</div>

  <div class="modal-backdrop" id="pinModal">

      <div class="modal-title">🔒 輸入管理密碼</div>
      <div class="modal-desc" id="pinModalDesc">請輸入管理者權限密碼（3701）</div>

      </div>

    <div class="modal-box">
      <div class="modal-title">📤 分享行程給朋友</div>

        <button class="modal-btn modal-cancel" id="shareCloseBtn">關閉</button>

  <script>
    const EDIT_PIN = "3701";
    const STORAGE_KEY = "xlq_15_trip_v18";

    const DEFAULT_DATA = {

        {

    let state = loadLocalState();
    let isEditing = false;
    let isUnlocked = false;
    let pendingAction = null;
    let pickingIndex = null;
    let map, routeLayer, markersLayer;

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const merged = Object.assign({}, DEFAULT_DATA, parsed);
          merged.collapsedStops = Object.assign({ day1: [], day2: [], day3A: [], day3B: [] }, parsed.collapsedStops || {});
          return merged;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveState(pushCloud = true) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      showToast("已儲存並同步");
      if (pushCloud && window._syncToFirebase) {
        window._syncToFirebase(state);
      }
    }

    function showToast(msg) {
      const el = document.getElementById("toastMsg");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function getActiveScheduleKey() {
      if (state.activeView === "day1") return "day1";
      if (state.activeView === "day2") return "day2";
      if (state.activeView === "day3") return state.day3Plan === "B" ? "day3B" : "day3A";
      return null;
    }

    function initMap() {
      const islandBounds = [[22.318, 120.354], [22.360, 120.396]];
      map = L.map("map", { zoomControl: true, attributionControl: false }).fitBounds(islandBounds);

      const tileSources = [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
        "https://tile.openstreetmap.de/{z}/{x}/{y}.png"
      ];
      let tileIdx = 0;
      const tileLayer = L.tileLayer(tileSources[0], { maxZoom: 18 }).addTo(map);
      tileLayer.on("tileerror", () => {
        if (tileIdx + 1 < tileSources.length) {
          tileIdx++;
          tileLayer.setUrl(tileSources[tileIdx]);
        }
      });

      const coastline = [
        [22.3556, 120.3812], [22.3532, 120.3888], [22.3465, 120.3875],
        [22.3375, 120.3822], [22.3282, 120.3752], [22.3228, 120.3695],
        [22.3238, 120.3612], [22.3315, 120.3605], [22.3412, 120.3618],
        [22.3495, 120.3692], [22.3538, 120.3765]
      ];
      L.polygon(coastline, {
        color: "#0284c7", weight: 2.5, fillColor: "#dcfce7", fillOpacity: 0.45
      }).addTo(map);

      const ringRoad = [
        [22.3522, 120.3812], [22.3515, 120.3875], [22.3448, 120.3852],
        [22.3358, 120.3792], [22.3268, 120.3718], [22.3248, 120.3628],
        [22.3325, 120.3622], [22.3418, 120.3635], [22.3492, 120.3702],
        [22.3522, 120.3812]
      ];
      L.polyline(ringRoad, { color: "#f59e0b", weight: 2.5, opacity: 0.75 }).addTo(map);

      const landmarks = [
        { lat: 22.3528, lng: 120.3820, text: "白沙尾港" },
        { lat: 22.3492, lng: 120.3695, text: "美人洞" },
        { lat: 22.3372, lng: 120.3610, text: "蛤板灣" },
        { lat: 22.3265, lng: 120.3718, text: "厚石魚澳" }
      ];
      landmarks.forEach(lm => {
        L.marker([lm.lat, lm.lng], {
          interactive: false,
          icon: L.divIcon({ className: "island-text-label", html: lm.text, iconSize: [60, 16] })
        }).addTo(map);
      });

      routeLayer = L.layerGroup().addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      map.on("click", (e) => {
        if (pickingIndex === null) return;
        const key = getActiveScheduleKey();
        if (!key) return;
        state[key][pickingIndex].lat = Number(e.latlng.lat.toFixed(5));
        state[key][pickingIndex].lng = Number(e.latlng.lng.toFixed(5));
        pickingIndex = null;
        document.getElementById("pickBanner").classList.remove("show");
        saveState(true);
        renderAll();
      });
    }

    function fitIslandView() {
      if (!map) return;
      map.fitBounds([[22.318, 120.354], [22.360, 120.396]], { padding: [12, 12] });
    }

    function renderMap() {
      if (!map) return;
      routeLayer.clearLayers();
      markersLayer.clearLayers();
      const key = getActiveScheduleKey();
      if (!key) return;
      const list = state[key] || [];
      const curIdx = Math.min(state.currentIndex[key] || 0, Math.max(0, list.length - 1));

      const coords = list.map(s => [s.lat, s.lng]);
      if (coords.length > 1) {
        L.polyline(coords, { color: "#64748b", weight: 3, dashArray: "6,6", opacity: 0.8 }).addTo(routeLayer);
        if (curIdx > 0) {
          L.polyline(coords.slice(0, curIdx + 1), { color: "#0284c7", weight: 4.5 }).addTo(routeLayer);
        }
      }

      list.forEach((stop, idx) => {
        if (idx === curIdx) {
          const shortTitle = stop.title.replace(/^\d+\.\s*/, "");

    function requireAdmin(actionFn, descText = "請輸入管理者權限密碼以進行操作") {
      if (isUnlocked) {
        actionFn();
        return;
      }
      pendingAction = actionFn;
      document.getElementById("pinModalDesc").textContent = descText;
      document.getElementById("pinInput").value = "";
      document.getElementById("pinError").textContent = "";
      document.getElementById("pinModal").classList.add("open");
      setTimeout(() => document.getElementById("pinInput").focus(), 60);
    }

    function selectStop(idx) {
      requireAdmin(() => {
        const key = getActiveScheduleKey();
        if (!key) return;
        state.currentIndex[key] = idx;
        saveState(true);
        renderAll();
      }, "切換目前站點僅限管理者操作，請輸入密碼");
    }

    function renderScheduleList() {
      const container = document.getElementById("scheduleListContainer");
      container.innerHTML = "";
      const key = getActiveScheduleKey();
      if (!key) return;

      if (state.activeView === "day3") {
        const bar = document.createElement("div");
        bar.className = "plan-switch-bar";
        const btnA = document.createElement("button");
        btnA.className = "plan-btn" + (state.day3Plan === "A" ? " active" : "");
        btnA.textContent = "🅰️ 方案A（東港午餐）";
        btnA.addEventListener("click", () => {
          state.day3Plan = "A";
          saveState(true);
          renderAll();
        });
        const btnB = document.createElement("button");
        btnB.className = "plan-btn" + (state.day3Plan === "B" ? " active" : "");
        btnB.textContent = "🅱️ 方案B（小琉球午餐）";
        btnB.addEventListener("click", () => {
          state.day3Plan = "B";
          saveState(true);
          renderAll();
        });
        bar.appendChild(btnA);
        bar.appendChild(btnB);
        container.appendChild(bar);
      }

      const list = state[key] || [];
      const curIdx = Math.min(state.currentIndex[key] || 0, Math.max(0, list.length - 1));

      list.forEach((item, idx) => {
        if (item.phase) {
          const div = document.createElement("div");
          div.className = "phase-divider";
          div.textContent = item.phase;
          container.appendChild(div);
        }

        const collapsedSet = state.collapsedStops[key] || [];
        const isCollapsed = collapsedSet.includes(idx);
        const isDone = idx < curIdx;

        const card = document.createElement("div");
        card.className = "stop-card" + (idx === curIdx ? " current" : "") + (isDone ? " done-stop" : "") + (isCollapsed ? " collapsed" : "");
        if (idx === curIdx) card.id = "activeStopCard";

        if (!isEditing) {
          card.addEventListener("click", () => selectStop(idx));
          const top = document.createElement("div");
          top.className = "stop-top";

          const main = document.createElement("div");
          main.className = "stop-main";

          const meta = document.createElement("div");
          meta.className = "stop-meta";
          if (item.time) {
            const tb = document.createElement("span");
            tb.className = "time-badge";
            tb.textContent = item.time;
            meta.appendChild(tb);
          }
          if (item.group === "A" || item.group === "AB") {
            const gbA = document.createElement("span");
            gbA.className = "group-badge group-a";
            gbA.textContent = "🚤 A組";
            meta.appendChild(gbA);
          }
          if (item.group === "B" || item.group === "AB") {
            const gbB = document.createElement("span");
            gbB.className = "group-badge group-b";
            gbB.textContent = "🛶 B組";
            meta.appendChild(gbB);
          }
          main.appendChild(meta);

          const title = document.createElement("div");
          title.className = "stop-title";
          title.textContent = item.title;
          main.appendChild(title);

          if (!isCollapsed && item.note) {
            const note = document.createElement("div");
            note.className = "stop-note";
            note.textContent = item.note;
            main.appendChild(note);
          }

          const rightBox = document.createElement("div");
          rightBox.className = "right-actions";

          const shrinkBtn = document.createElement("button");
          shrinkBtn.type = "button";
          shrinkBtn.className = "collapse-btn" + (isCollapsed ? " active" : "");
          shrinkBtn.textContent = isCollapsed ? "展開" : "縮小";
          shrinkBtn.title = isCollapsed ? "展開此站說明" : "縮小此站卡片";
          shrinkBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const arr = state.collapsedStops[key] || [];
            const pos = arr.indexOf(idx);
            if (pos >= 0) {
              arr.splice(pos, 1);
            } else {
              arr.push(idx);
            }
            state.collapsedStops[key] = arr;
            saveState(true);
            renderAll();
          });

          const navLink = document.createElement("a");
          navLink.className = "nav-go-btn";
          navLink.textContent = "導航";
          navLink.href = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
          navLink.target = "_blank";
          navLink.rel = "noopener";
          navLink.addEventListener("click", (e) => e.stopPropagation());

          rightBox.appendChild(shrinkBtn);
          rightBox.appendChild(navLink);

          top.appendChild(main);
          top.appendChild(rightBox);
          card.appendChild(top);
        } else {
          const editRow = document.createElement("div");
          editRow.className = "edit-row";

          const timeIn = document.createElement("input");
          timeIn.className = "edit-input";
          timeIn.value = item.time || "";
          timeIn.placeholder = "時間（如 12:00－12:45）";
          timeIn.addEventListener("input", () => { item.time = timeIn.value; });

          const titleIn = document.createElement("input");
          titleIn.className = "edit-input";
          titleIn.value = item.title || "";
          titleIn.placeholder = "站點名稱";
          titleIn.addEventListener("input", () => { item.title = titleIn.value; });

          const noteIn = document.createElement("textarea");
          noteIn.className = "edit-textarea";
          noteIn.value = item.note || "";
          noteIn.placeholder = "說明備註";
          noteIn.addEventListener("input", () => { item.note = noteIn.value; });

          const acts = document.createElement("div");
          acts.className = "edit-actions";

          const pinBtn = document.createElement("button");
          pinBtn.className = "mini-btn pin";
          pinBtn.textContent = pickingIndex === idx ? "🎯 點擊上方地圖..." : "📍 地圖設位置";
          pinBtn.addEventListener("click", () => {
            pickingIndex = idx;
            document.getElementById("pickBanner").classList.add("show");
            renderScheduleList();
          });

          const upBtn = document.createElement("button");
          upBtn.className = "mini-btn";
          upBtn.textContent = "↑ 上移";
          upBtn.addEventListener("click", () => {
            if (idx > 0) {
              [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
              renderScheduleList();
              renderMap();
            }
          });

          const delBtn = document.createElement("button");
          delBtn.className = "mini-btn del";
          delBtn.textContent = "🗑️ 刪除";
          delBtn.addEventListener("click", () => {
            list.splice(idx, 1);
            renderScheduleList();
            renderMap();
          });

          acts.appendChild(pinBtn);
          acts.appendChild(upBtn);
          acts.appendChild(delBtn);

          editRow.appendChild(timeIn);
          editRow.appendChild(titleIn);
          editRow.appendChild(noteIn);
          editRow.appendChild(acts);
          card.appendChild(editRow);
        }

        container.appendChild(card);
      });

      if (isEditing) {
        const addBtn = document.createElement("button");
        addBtn.className = "add-item-btn";
        addBtn.textContent = "＋ 新增行程站點";
        addBtn.addEventListener("click", () => {
          list.push({ phase: "", time: "待定", group: "", title: "新站點", note: "", lat: 22.345, lng: 120.375 });
          renderScheduleList();
          renderMap();
        });
        container.appendChild(addBtn);
      }
    }

    function renderInfoPage() {
      const container = document.getElementById("infoPageContainer");
      container.innerHTML = "";
      const key = state.activeView;
      if (key !== "notes" && key !== "departure") return;
      const items = state[key] || [];

      items.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "info-card";
        if (!isEditing) {
          if (item.time) {
            const t = document.createElement("div");
            t.className = "info-time";
            t.textContent = item.time;
            card.appendChild(t);
          }
          const h = document.createElement("div");
          h.className = "info-title";
          h.textContent = item.title;
          card.appendChild(h);

          const b = document.createElement("div");
          b.className = "info-body";
          b.textContent = item.body;
          card.appendChild(b);
        } else {
          const row = document.createElement("div");
          row.className = "edit-row";

          const timeIn = document.createElement("input");
          timeIn.className = "edit-input";
          timeIn.value = item.time || "";
          timeIn.placeholder = "標籤／時段";
          timeIn.addEventListener("input", () => { item.time = timeIn.value; });

          const titleIn = document.createElement("input");
          titleIn.className = "edit-input";
          titleIn.value = item.title || "";
          titleIn.placeholder = "標題";
          titleIn.addEventListener("input", () => { item.title = titleIn.value; });

          const bodyIn = document.createElement("textarea");
          bodyIn.className = "edit-textarea";
          bodyIn.value = item.body || "";
          bodyIn.placeholder = "詳細內容";
          bodyIn.addEventListener("input", () => { item.body = bodyIn.value; });

          const delBtn = document.createElement("button");
          delBtn.className = "mini-btn del";
          delBtn.textContent = "🗑️ 刪除此卡片";
          delBtn.addEventListener("click", () => {
            items.splice(idx, 1);
            renderInfoPage();
          });

          row.appendChild(timeIn);
          row.appendChild(titleIn);
          row.appendChild(bodyIn);
          row.appendChild(delBtn);
          card.appendChild(row);
        }
        container.appendChild(card);
      });

      if (isEditing) {
        const addBtn = document.createElement("button");
        addBtn.className = "add-item-btn";
        addBtn.textContent = "＋ 新增卡片";
        addBtn.addEventListener("click", () => {
          items.push({ time: "新增項目", title: "標題", body: "內容說明" });
          renderInfoPage();
        });
        container.appendChild(addBtn);
      }
    }

    function renderAll() {
      const labels = {
        notes: "注意事項",
        departure: "當天出發時間排程",
        day1: "3/19｜day1時間排程",
        day2: "3/20｜day2時間排程",
        day3: "3/21｜day3時間排程"
      };
      document.getElementById("currentViewLabel").textContent = labels[state.activeView] || "3/19｜day1時間排程";

      document.querySelectorAll(".nav-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === state.activeView);
      });

      const editBtn = document.getElementById("editToggleBtn");
      editBtn.textContent = isEditing ? "✅ 完成" : "✏️ 編輯";
      editBtn.classList.toggle("active", isEditing);

      const isSchedule = ["day1", "day2", "day3"].includes(state.activeView);
      document.getElementById("mapScheduleWrap").style.display = isSchedule ? "flex" : "none";
      document.getElementById("nextStopBtn").style.display = isSchedule ? "inline-flex" : "none";
      document.getElementById("infoPageContainer").classList.toggle("active", !isSchedule);

      if (isSchedule) {
        renderScheduleList();
        renderMap();
        setTimeout(() => { if (map) map.invalidateSize(); }, 50);
      } else {
        renderInfoPage();
      }
    }

    document.getElementById("menuToggleBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("navDropdown").classList.toggle("open");
    });

    document.addEventListener("click", () => {
      document.getElementById("navDropdown").classList.remove("open");
    });

    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeView = btn.dataset.view;
        document.getElementById("navDropdown").classList.remove("open");
        renderAll();
      });
    });

    document.getElementById("fitIslandBtn").addEventListener("click", fitIslandView);
    document.getElementById("toggleMapSizeBtn").addEventListener("click", () => {
      const box = document.getElementById("mapBox");
      const btn = document.getElementById("toggleMapSizeBtn");
      const expanded = box.classList.toggle("expanded");
      btn.textContent = expanded ? "↕️ 縮小地圖" : "↕️ 放大地圖";
      setTimeout(() => { if (map) { map.invalidateSize(); fitIslandView(); } }, 240);
    });

    document.getElementById("nextStopBtn").addEventListener("click", () => {
      requireAdmin(() => {
        const key = getActiveScheduleKey();
        if (!key) return;
        const list = state[key] || [];
        if (!list.length) return;
        state.currentIndex[key] = ((state.currentIndex[key] || 0) + 1) % list.length;
        saveState(true);
        renderAll();
        const activeEl = document.getElementById("activeStopCard");
        if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, "「下一站 ➔」僅限管理者操作，請輸入密碼");
    });

    document.getElementById("editToggleBtn").addEventListener("click", () => {
      if (isEditing) {
        isEditing = false;
        pickingIndex = null;
        document.getElementById("pickBanner").classList.remove("show");
        saveState(true);
        renderAll();
        return;
      }
      requireAdmin(() => {
        isEditing = true;
        renderAll();
      }, "請輸入管理者權限密碼以編輯行程");
    });

    document.getElementById("pinCancelBtn").addEventListener("click", () => {
      pendingAction = null;
      document.getElementById("pinModal").classList.remove("open");
    });

    function verifyPin() {
      const val = document.getElementById("pinInput").value.trim();
      if (val === EDIT_PIN) {
        isUnlocked = true;
        document.getElementById("pinModal").classList.remove("open");
        const act = pendingAction;
        pendingAction = null;
        if (act) {
          act();
        } else {
          renderAll();
        }
      } else {
        document.getElementById("pinError").textContent = "❌ 密碼錯誤，請重新輸入";
        document.getElementById("pinInput").value = "";
        document.getElementById("pinInput").focus();
      }
    }

    document.getElementById("pinConfirmBtn").addEventListener("click", verifyPin);
    document.getElementById("pinInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") verifyPin();
    });

    function getSharePayload() {
      const url = window.location.href;
      const key = getActiveScheduleKey();
      let curStopText = "";
      if (key && state[key] && state[key].length) {
        const curIdx = Math.min(state.currentIndex[key] || 0, state[key].length - 1);
        const stop = state[key][curIdx];
        const dayMap = { day1: "Day1 (3/19)", day2: "Day2 (3/20)", day3A: "Day3 方案A (3/21)", day3B: "Day3 方案B (3/21)" };
        curStopText = `
📍 目前進度（${dayMap[key] || ""}）：${stop.title.replace(/^\d+\.\s*/, "")}`;
      }
      const text = `🏝️ 趣小琉球Hi三天兩夜｜即時路線同步地圖${curStopText}
👉 點擊查看即時行程與導航：`;
      return { url, text, fullText: `${text}
${url}` };
    }

    function openShareModalFallback() {
      const payload = getSharePayload();
      const urlInput = document.getElementById("shareUrlInput");
      const lineLink = document.getElementById("lineShareLink");
      const modal = document.getElementById("shareModal");
      if (urlInput) urlInput.value = payload.url;
      if (lineLink) lineLink.href = `https://line.me/R/msg/text/?${encodeURIComponent(payload.fullText)}`;
      if (modal) modal.classList.add("open");
    }

    document.getElementById("shareBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const payload = getSharePayload();
      const isHttp = /^https?:$/i.test(window.location.protocol);
      if (isHttp && typeof navigator.share === "function") {
        try {
          await navigator.share({
            title: "趣小琉球Hi三天兩夜｜即時路線同步地圖",
            text: payload.text,
            url: payload.url
          });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      openShareModalFallback();
    });

    document.getElementById("copyShareBtn").addEventListener("click", async () => {
      const payload = getSharePayload();
      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(payload.fullText);
          copied = true;
        } catch (e) {}
      }
      if (!copied) {
        const inp = document.getElementById("shareUrlInput");
        if (inp) { inp.select(); }
        showToast("請手動複製下方網址");
      }
      closeShareModal();
    });

    function resetViewportAndLayout() {
      try {
        if (document.activeElement && typeof document.activeElement.blur === "function") {
          document.activeElement.blur();
        }
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      } catch (e) {}
      if (map) {
        setTimeout(() => {
          map.invalidateSize();
        }, 100);
      }
    }

    function closeShareModal() {
      const modal = document.getElementById("shareModal");
      if (modal) modal.classList.remove("open");
      resetViewportAndLayout();
    }

    document.getElementById("shareCloseBtn").addEventListener("click", closeShareModal);

    document.getElementById("shareModal").addEventListener("click", (e) => {
      if (e.target.id === "shareModal") {
        closeShareModal();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        resetViewportAndLayout();
      }
    });

    window.addEventListener("pageshow", resetViewportAndLayout);
    window.addEventListener("resize", () => {
      if (map) {
        clearTimeout(window._resizeMapTimer);
        window._resizeMapTimer = setTimeout(() => map.invalidateSize(), 120);
      }
    });

    initMap();
    renderAll();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "project-4310350545072047895",
      appId: "1:4310350545072047895:web:xlq15group"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const tripDocRef = doc(db, "trips", "xiaoliuqiu-15-group-v10");
      let ignoreNextSnapshot = false;

      window._syncToFirebase = async (latestState) => {
        try {
          ignoreNextSnapshot = true;
          await setDoc(tripDocRef, {
            payload: JSON.stringify(latestState),
            updatedAt: Date.now()
          }, { merge: true });
        } catch (err) {
          console.warn("Firebase write skipped:", err);
        }
      };

      onSnapshot(tripDocRef, (snap) => {
        const dot = document.getElementById("syncDot");
        if (dot) {
          dot.classList.add("online");
          dot.title = "雲端即時同步中";
        }
        if (ignoreNextSnapshot) {
          ignoreNextSnapshot = false;
          return;
        }
        if (snap.exists() && snap.data().payload && !isEditing) {
          try {
            const remoteState = JSON.parse(snap.data().payload);
            const currentViewKeep = state.activeView;
            state = Object.assign({}, state, remoteState, { activeView: currentViewKeep });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            renderAll();
          } catch (e) {}
        }
      });
    } catch (e) {
      console.warn("Firebase init fallback:", e);
    }
  </script>
</body>
