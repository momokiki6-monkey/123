<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <style>

      box-sizing: border-box;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      transition: background 0.8s ease, color 0.4s ease;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;

    body[data-theme="ocean-blue"] {

      background-size: cover;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(186, 230, 253, 0.9);
      --text-primary: #0f172a;
      --header-text: #ffffff;
      --header-sub: #bae6fd;
      --panel-bg: rgba(15, 23, 42, 0.6);
      --panel-border: rgba(255, 255, 255, 0.25);
    }

    body[data-theme="sunny-beach"] {
      background: linear-gradient(rgba(245, 158, 11, 0.3), rgba(2, 132, 199, 0.6)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(253, 224, 71, 0.8);
      --text-primary: #1e293b;
      --header-text: #0f172a;
      --header-sub: #1e3a8a;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(217, 119, 6, 0.3);
    }

    body[data-theme="deep-starry"] {
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(2, 6, 23, 0.95)), 
                  url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      --card-bg: rgba(30, 41, 59, 0.93);
      --card-border: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --header-text: #f8fafc;
      --header-sub: #7dd3fc;
      --panel-bg: rgba(30, 41, 59, 0.78);
      --panel-border: rgba(56, 189, 248, 0.3);
    }

    body[data-theme="mint-breeze"] {
      background: linear-gradient(rgba(13, 148, 136, 0.45), rgba(6, 78, 59, 0.7)),

      background-size: cover;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(45, 212, 191, 0.55);
      --text-primary: #064e3b;
      --header-text: #ffffff;
      --header-sub: #99f6e4;
      --panel-bg: rgba(6, 78, 59, 0.65);
      --panel-border: rgba(45, 212, 191, 0.4);
    }

    body[data-theme="warm-ivory"] {
      background: linear-gradient(rgba(243, 239, 230, 0.85), rgba(230, 220, 205, 0.95)),

      --card-bg: #ffffff;
      --card-border: #e5dec9;
      --text-primary: #292524;
      --header-text: #1c1917;
      --header-sub: #57534e;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: #d6d3d1;
    }

    .food-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-primary);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.25);
    }

    .theme-header-title { color: var(--header-text); }
    .theme-header-sub { color: var(--header-sub); }
    .theme-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
    }

    @keyframes swimTurtle1 {
      0% { transform: translate(-120px, 60vh) rotate(15deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.25; }
      80% { opacity: 0.25; }
      100% { transform: translate(110vw, 15vh) rotate(-15deg) scale(1); opacity: 0; }
    }

      0% { transform: translate(110vw, 75vh) rotate(-20deg) scale(0.85); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translate(-120px, 25vh) rotate(20deg) scale(0.75); opacity: 0; }
    }

    .turtle-swimming-1 {
      position: absolute;
      animation: swimTurtle1 26s linear infinite;
      pointer-events: none;
    }

    .turtle-swimming-2 {
      position: absolute;
      animation: swimTurtle2 32s linear infinite;
      pointer-events: none;
    }

      { id: "15", name: "小琉球在地風味餐館", category: "正餐", address: "屏東縣琉球鄉民生路", phone: "08-8611498", hours: "10:00–17:00", note: "道地小琉球家常海味料理。", highlight: "在地漁村風味 • 午間推薦", emoji: "🐟", imageUrl: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=900&q=80", url: "" },
      { id: "16", name: "小琉球在地風味餐館", category: "正餐", address: "屏東縣琉球鄉民生路", phone: "08-8611498", hours: "10:00–17:00", note: "道地小琉球家常海味料理。", highlight: "在地漁村風味 • 午間推薦", emoji: "🐟", imageUrl: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=900&q=80", url: "" }
    ];

    let currentCategory = "all";
    let searchQuery = "";

    // 渲染分類按鈕
    function renderCategories() {
      const container = document.getElementById("categoryFilterContainer");
      if (!container) return;

      let html = `<button type="button" data-cat="all" class="cat-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold ${currentCategory === 'all' ? 'bg-sky-500 text-white shadow' : 'bg-white/85 text-slate-700'} shadow-sm">全部 (${foodStores.length})</button>`;

      categories.forEach(cat => {
        const isActive = currentCategory === cat;
        html += `
          <button type="button" data-cat="${cat}" class="cat-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold ${isActive ? 'bg-sky-500 text-white shadow' : 'bg-white/85 text-slate-700'} shadow-sm">
            ${cat}
          </button>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll(".cat-btn").forEach(btn => {
        btn.onclick = () => {
          currentCategory = btn.dataset.cat;
          renderCategories();
          renderCards();
        };
      });
    }

    // 點擊名稱
    window.handleNameClick = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      if (s.url && s.url.trim() !== "") {
        window.open(s.url.trim(), "_blank");
      } else {
        openPhotoModal(id);
      }
    };

    // 渲染卡片
    function renderCards() {
      const grid = document.getElementById("foodGrid");
      if (!grid) return;

      const filtered = foodStores.filter(s => {
        const matchCat = currentCategory === "all" || s.category === currentCategory;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q || s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      const countEl = document.getElementById("resultCount");
      if (countEl) countEl.textContent = `目前顯示 ${filtered.length} / ${foodStores.length} 間小琉球美食店家`;
      
      const emptyEl = document.getElementById("emptyState");
      if (emptyEl) emptyEl.classList.toggle("hidden", filtered.length > 0);

      grid.innerHTML = filtered.map(s => `
        <article class="food-card rounded-3xl p-5 sm:p-6 flex flex-col justify-between shadow-lg">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-black bg-sky-600 text-white">NO.${s.id}</span>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800">${s.emoji || '🍽️'} ${s.category}</span>
            </div>
            
            <h3 class="text-lg font-black mb-2 cursor-pointer hover:underline text-sky-700 dark:text-sky-300" onclick="handleNameClick('${s.id}')">
              ${s.name} ${s.url ? '🔗' : ''}
            </h3>
            
            <div class="w-full h-40 sm:h-44 rounded-2xl overflow-hidden mb-3 shadow-md cursor-pointer bg-slate-100" onclick="openPhotoModal('${s.id}')">
              <img src="${s.imageUrl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80'}" alt="${s.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300" />
            </div>

            <p class="text-xs font-bold mb-2 opacity-95">✨ ${s.highlight || '小琉球推薦'}</p>
            <p class="text-sm opacity-90 mb-4">${s.note}</p>
          </div>
          <div class="pt-3 border-t text-xs space-y-1">
            <p class="opacity-80">🕒 ${s.hours || '依店家公告'}</p>
            <p class="text-emerald-700 dark:text-emerald-400 font-bold cursor-pointer hover:underline" onclick="openMapModal('${s.id}')">📍 ${s.address}</p>
          </div>
        </article>
      `).join("");
    }

    // 主題切換
    const themeButtons = document.querySelectorAll("[data-theme-btn]");
    function applyTheme(themeName) {
      document.body.setAttribute("data-theme", themeName);
      themeButtons.forEach(btn => {
        btn.classList.remove("ring-2", "ring-white", "scale-105", "shadow-lg");
        if (btn.getAttribute("data-theme-btn") === themeName) {
          btn.classList.add("ring-2", "ring-white", "scale-105", "shadow-lg");
        }
      });
      localStorage.setItem(STORAGE_KEY_THEME, themeName);
    }

    themeButtons.forEach(btn => {
      btn.addEventListener("click", () => applyTheme(btn.getAttribute("data-theme-btn")));
    });

    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
    if (savedTheme) applyTheme(savedTheme);

    // 燈箱控制
    window.openPhotoModal = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      document.getElementById("photoModalTitle").textContent = s.name;
      document.getElementById("modalDescription").textContent = s.note;
      document.getElementById("modalHours").textContent = s.hours;
      document.getElementById("modalPhone").textContent = s.phone;
      document.getElementById("modalPhone").href = `tel:${s.phone}`;
      document.getElementById("modalFoodImg").src = s.imageUrl || "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80";
      const photoModal = document.getElementById("photoModal");
      if (photoModal) {
        photoModal.classList.remove("hidden");
        photoModal.classList.add("flex");
      }
    };

    window.openMapModal = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      document.getElementById("mapModalTitle").textContent = s.name;
      document.getElementById("mapModalAddress").textContent = s.address;
      document.getElementById("googleMapIframe").src = `https://maps.google.com/maps?q=${encodeURIComponent(s.address)}&output=embed`;
      const mapModal = document.getElementById("mapModal");
      if (mapModal) {
        mapModal.classList.remove("hidden");
        mapModal.classList.add("flex");
      }
    };

    const closePhoto = document.getElementById("closePhotoModal");
    const closeMap = document.getElementById("closeMapModal");
    if (closePhoto) closePhoto.onclick = () => document.getElementById("photoModal").classList.add("hidden");
    if (closeMap) closeMap.onclick = () => document.getElementById("mapModal").classList.add("hidden");

    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderCards();
      };
    }

    const resetFilter = document.getElementById("resetFilterBtn");
    if (resetFilter) {
      resetFilter.onclick = () => {
        currentCategory = "all";
        searchQuery = "";
        if (searchInput) searchInput.value = "";
        renderCategories();
        renderCards();
      };
    }

    // 初始化
    renderCategories();
    renderCards();
  </script>
</body>
</html>
