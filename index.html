<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小琉球海島美食指南｜海洋海龜版</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      transition: background 0.5s ease, color 0.4s ease;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 五種海洋海龜主題背景變數 */
    body[data-theme="ocean-blue"] {
      --bg-style: linear-gradient(135deg, #0284c7 0%, #0369a1 45%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(186, 230, 253, 0.85);
      --text-primary: #0f172a;
      --header-text: #ffffff;
      --header-sub: #bae6fd;
      --panel-bg: rgba(15, 23, 42, 0.55);
      --panel-border: rgba(255, 255, 255, 0.25);
    }

    body[data-theme="sunny-beach"] {
      --bg-style: linear-gradient(135deg, #fef3c7 0%, #fde68a 35%, #bae6fd 75%, #38bdf8 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(253, 224, 71, 0.8);
      --text-primary: #1e293b;
      --header-text: #0f172a;
      --header-sub: #1e3a8a;
      --panel-bg: rgba(255, 255, 255, 0.78);
      --panel-border: rgba(217, 119, 6, 0.3);
    }

    body[data-theme="deep-starry"] {
      --bg-style: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 55%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.92);
      --card-border: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --header-text: #f8fafc;
      --header-sub: #7dd3fc;
      --panel-bg: rgba(30, 41, 59, 0.75);
      --panel-border: rgba(56, 189, 248, 0.3);
    }

    body[data-theme="mint-breeze"] {
      --bg-style: linear-gradient(135deg, #ccfbf1 0%, #99f6e4 45%, #a7f3d0 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(45, 212, 191, 0.55);
      --text-primary: #064e3b;
      --header-text: #064e3b;
      --header-sub: #0f766e;
      --panel-bg: rgba(255, 255, 255, 0.8);
      --panel-border: rgba(13, 148, 136, 0.3);
    }

    body[data-theme="warm-ivory"] {
      --bg-style: linear-gradient(180deg, #faf8f5 0%, #f3efe6 100%);
      --card-bg: #ffffff;
      --card-border: #e5dec9;
      --text-primary: #292524;
      --header-text: #1c1917;
      --header-sub: #57534e;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: #d6d3d1;
    }

    body {
      background: var(--bg-style);
      color: var(--text-primary);
    }

    .food-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-primary);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.2);
    }

    .theme-header-title { color: var(--header-text); }
    .theme-header-sub { color: var(--header-sub); }
    .theme-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
    }

    @keyframes floatTurtle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    .turtle-float { animation: floatTurtle 5s ease-in-out infinite; }
  </style>
</head>
<body data-theme="ocean-blue" class="antialiased selection:bg-sky-400 selection:text-white">

  <!-- 背景裝飾海龜 -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-15" aria-hidden="true">
    <svg class="w-48 h-48 absolute top-10 right-6 turtle-float text-current" viewBox="0 0 120 120" fill="currentColor">
      <path d="M60 22c-16 0-28 14-28 32s12 34 28 34 28-16 28-34-12-32-28-32zm0 8c11 0 20 10 20 24s-9 26-20 26-20-12-20-26 9-24 20-24z"/>
    </svg>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

    <!-- 頁首 -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md border border-white/30 mb-4">
        <span class="text-xl">🐢</span>
        <span class="text-xs sm:text-sm font-bold tracking-wider uppercase theme-header-title">XIAOLIUQIU OCEAN • TURTLE • ISLAND</span>
      </div>
      <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black tracking-tight theme-header-title mb-3 leading-tight">
        小琉球海島美食指南
      </h1>
      <p class="text-sm sm:text-base max-w-2xl mx-auto theme-header-sub font-medium leading-relaxed">
        完整收錄 01–15 號在地經典美食。點擊<strong class="underline">店家名稱</strong>可前往指定網址（若未設定則開啟照片大圖）！
      </p>
    </header>

    <!-- 控制列：主題切換與分類 -->
    <section class="theme-panel rounded-3xl p-4 sm:p-6 mb-8 shadow-xl space-y-4">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 pb-4 border-b border-white/20">
        <div>
          <h2 class="text-sm sm:text-base font-bold theme-header-title">🎨 選擇背景氛圍主題</h2>
        </div>
        <div class="flex flex-wrap gap-2" id="themeSelector">
          <button type="button" data-theme-btn="ocean-blue" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-600 text-white shadow">🌊 湛藍海洋</button>
          <button type="button" data-theme-btn="sunny-beach" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-amber-100 text-amber-900">🏖️ 陽光白沙灘</button>
          <button type="button" data-theme-btn="deep-starry" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-800 text-sky-300">🌌 深海星空</button>
          <button type="button" data-theme-btn="mint-breeze" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-teal-100 text-teal-900">🌿 薄荷海風</button>
          <button type="button" data-theme-btn="warm-ivory" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-stone-100 text-stone-800">📖 柔和米白</button>
        </div>
      </div>

      <!-- 搜尋與可修改的分類列 -->
      <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="relative w-full md:flex-1">
          <input type="text" id="searchInput" placeholder="搜尋編號、店名或地址..." class="w-full px-4 py-2.5 rounded-2xl bg-white/95 text-slate-900 text-sm font-medium border focus:outline-none focus:ring-2 focus:ring-sky-400 shadow-sm" />
        </div>
        
        <!-- 動態分類篩選按鈕容器 -->
        <div class="flex flex-wrap gap-2 items-center" id="categoryFilterContainer"></div>
      </div>

      <!-- 新增與還原按鈕 -->
      <div class="pt-3 border-t border-white/20 flex flex-wrap items-center justify-between gap-3">
        <button type="button" id="openAddModalBtn" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-sm shadow-lg transition flex items-center gap-2">
          <span>＋</span> 新增美食項目
        </button>
        <button type="button" id="restoreDefaultBtn" class="px-3.5 py-2 rounded-xl bg-white/20 hover:bg-white/30 border border-white/30 text-xs font-bold theme-header-title transition">
          ↺ 恢復預設 15 間與分類
        </button>
      </div>
    </section>

    <!-- 統計提示 -->
    <div class="flex justify-between items-center mb-4 px-1">
      <p id="resultCount" class="text-sm font-bold theme-header-title">目前顯示全部店家</p>
    </div>

    <!-- 卡片網格 -->
    <main id="foodGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></main>

    <!-- 無搜尋結果 -->
    <div id="emptyState" class="hidden text-center py-16 theme-panel rounded-3xl mt-6">
      <div class="text-5xl mb-3">🐢</div>
      <h3 class="text-xl font-bold theme-header-title mb-2">找不到符合條件的美食店家</h3>
      <button type="button" id="resetFilterBtn" class="px-5 py-2.5 rounded-xl bg-sky-500 text-white font-bold text-sm">顯示全部美食</button>
    </div>

    <!-- 頁尾 -->
    <footer class="mt-14 pt-6 border-t border-white/20 text-center text-xs theme-header-sub">
      <p class="font-bold">🐢 小琉球海島美食指南（海洋海龜版）</p>
    </footer>

      { id: "11", name: "小琉球手搖飲/海島特調", category: "🍧 咖啡/甜品", address: "屏東縣琉球鄉民生路1號", phone: "0965-105-988", hours: "11:00–17:00", note: "環島騎車途中清涼果茶。", highlight: "環島必喝 • 清爽果茶", emoji: "🧋", imageUrl: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=900&q=80", url: "" },
      { id: "12", name: "小琉球海龜燒/特色點心", category: "🍧 咖啡/甜品", address: "屏東縣琉球鄉中山路30號", phone: "現場購買", hours: "11:00–18:00", note: "超萌海龜造型雞蛋糕與特色小點。", highlight: "超萌海龜造型 • 打卡必吃", emoji: "🧇", imageUrl: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=900&q=80", url: "" },
      { id: "13", name: "島嶼檸檬茶咖啡餐酒館", category: "🍧 咖啡/甜品", address: "屏東縣琉球鄉三民路11-12號", phone: "0968-688892", hours: "11:00–18:00", note: "新鮮島嶼檸檬特調飲品與輕食。", highlight: "島嶼檸檬特調 • 質感餐酒館", emoji: "🍋", imageUrl: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=900&q=80", url: "" },
      { id: "14", name: "小琉球海景甜品/輕食", category: "🍧 咖啡/甜品", address: "屏東縣琉球鄉民族路36-17號", phone: "現場候位", hours: "10:00–17:00", note: "精緻手作甜品與輕食小店。", highlight: "手作甜品 • 輕食午茶", emoji: "🍰", imageUrl: "https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=900&q=80", url: "" },
      { id: "15", name: "小琉球在地風味餐館", category: "🍽️ 正餐/燒烤", address: "屏東縣琉球鄉民生路", phone: "08-8611498", hours: "10:00–17:00", note: "道地小琉球家常海味料理。", highlight: "在地漁村風味 • 午間推薦", emoji: "🐟", imageUrl: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=900&q=80", url: "" }
    ];

    let foodStores = JSON.parse(localStorage.getItem(STORAGE_KEY_STORES)) || defaultFoodStores;
    let currentCategory = "all";
    let searchQuery = "";

    // 渲染動態分類按鈕
    function renderCategories() {
      const container = document.getElementById("categoryFilterContainer");
      const selectElem = document.getElementById("inputStoreCategory");

      let html = `<button type="button" data-cat="all" class="cat-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold ${currentCategory === 'all' ? 'bg-sky-500 text-white' : 'bg-white/85 text-slate-700'} shadow-sm">全部 (${foodStores.length})</button>`;

      categories.forEach((cat, index) => {
        const isActive = currentCategory === cat;
        html += `
          <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold ${isActive ? 'bg-sky-500 text-white shadow-sm' : 'bg-white/85 text-slate-700'}">
            <button type="button" data-cat="${cat}" class="cat-text-btn hover:underline">${cat}</button>
            <button type="button" onclick="editCategoryName(${index})" class="text-[10px] opacity-75 hover:opacity-100 px-1.5 py-0.5 rounded bg-black/10" title="修改分類名稱">✏️ 改名</button>
          </div>
        `;
      });

      container.innerHTML = html;
      selectElem.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join("");

      container.querySelectorAll(".cat-text-btn").forEach(btn => {
        btn.onclick = () => {
          currentCategory = btn.dataset.cat;
          renderCategories();
          renderCards();
        };
      });

      container.querySelector('[data-cat="all"]').onclick = () => {
        currentCategory = "all";
        renderCategories();
        renderCards();
      };
    }

    window.editCategoryName = function(index) {
      const oldName = categories[index];
      const newName = prompt(`請輸入新的分類名稱（原名稱：${oldName}）：`, oldName);
      if (!newName || !newName.trim()) return;
      const trimmed = newName.trim();

      if (categories.includes(trimmed)) {
        alert("此分類名稱已存在！");
        return;
      }

      categories[index] = trimmed;
      localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(categories));

      foodStores.forEach(s => {
        if (s.category === oldName) s.category = trimmed;
      });
      localStorage.setItem(STORAGE_KEY_STORES, JSON.stringify(foodStores));

      if (currentCategory === oldName) currentCategory = trimmed;

      renderCategories();
      renderCards();
    };

    // 點擊名稱後的處理邏輯（有網址開網址，沒網址開圖片燈箱）
    window.handleNameClick = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      if (s.url && s.url.trim() !== "") {
        window.open(s.url.trim(), "_blank");
      } else {
        openPhotoModal(id);
      }
    };

    // 渲染卡片
    function renderCards() {
      const grid = document.getElementById("foodGrid");
      const filtered = foodStores.filter(s => {
        const matchCat = currentCategory === "all" || s.category === currentCategory;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q || s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      document.getElementById("resultCount").textContent = `目前顯示 ${filtered.length} / ${foodStores.length} 間小琉球美食店家`;
      document.getElementById("emptyState").classList.toggle("hidden", filtered.length > 0);

      grid.innerHTML = filtered.map(s => `
        <article class="food-card rounded-3xl p-5 sm:p-6 flex flex-col justify-between shadow-lg">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-black bg-sky-600 text-white">NO.${s.id}</span>
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800">${s.emoji || '🍽️'} ${s.category}</span>
              <button type="button" onclick="openEditModal('${s.id}')" class="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-xs font-bold">✏️ 編輯</button>
            </div>
            
            <!-- 點擊名稱：有網址開網址，沒網址開照片燈箱 -->
            <h3 class="text-lg font-black mb-2 cursor-pointer hover:underline text-sky-700 dark:text-sky-400" onclick="handleNameClick('${s.id}')">
              ${s.name} ${s.url ? '🔗' : ''}
            </h3>
            
            <!-- 名稱下方照片 -->
            <div class="w-full h-40 sm:h-44 rounded-2xl overflow-hidden mb-3 shadow-md cursor-pointer bg-slate-100" onclick="openPhotoModal('${s.id}')">
              <img src="${s.imageUrl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80'}" alt="${s.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300" />
            </div>

            <p class="text-xs font-bold mb-2 opacity-90">✨ ${s.highlight || '小琉球推薦'}</p>
            <p class="text-sm opacity-90 mb-4">${s.note}</p>
          </div>
          <div class="pt-3 border-t text-xs space-y-1">
            <p class="opacity-80">🕒 ${s.hours || '依店家公告'}</p>
            <p class="text-emerald-700 font-bold cursor-pointer hover:underline" onclick="openMapModal('${s.id}')">📍 ${s.address}</p>
          </div>
        </article>
      `).join("");
    }

    // 主題切換
    const themeButtons = document.querySelectorAll("[data-theme-btn]");
    function applyTheme(themeName) {
      document.body.setAttribute("data-theme", themeName);
      themeButtons.forEach(btn => {
        btn.classList.remove("ring-2", "ring-white", "scale-105");
        if (btn.getAttribute("data-theme-btn") === themeName) {
          btn.classList.add("ring-2", "ring-white", "scale-105");
        }
      });
      localStorage.setItem(STORAGE_KEY_THEME, themeName);
    }

    themeButtons.forEach(btn => {
      btn.addEventListener("click", () => applyTheme(btn.getAttribute("data-theme-btn")));
    });

    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
    if (savedTheme) applyTheme(savedTheme);

    // 新增與編輯店家邏輯
    const editModal = document.getElementById("editModal");
    const storeForm = document.getElementById("storeForm");

    document.getElementById("openAddModalBtn").addEventListener("click", () => {
      document.getElementById("formMode").value = "add";
      document.getElementById("originalStoreId").value = "";
      document.getElementById("editModalHeading").textContent = "新增小琉球美食項目";
      document.getElementById("deleteStoreBtn").classList.add("hidden");

      let maxNum = 0;
      foodStores.forEach(s => {
        const n = parseInt(s.id, 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      });
      const nextId = (maxNum + 1 < 10 ? "0" : "") + (maxNum + 1);

      document.getElementById("inputStoreId").value = nextId;
      document.getElementById("inputStoreName").value = "";
      document.getElementById("inputStoreUrl").value = "";
      document.getElementById("inputPhotoUrl").value = "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80";
      document.getElementById("inputStorePhone").value = "";
      document.getElementById("inputStoreHours").value = "10:00–20:00";
      document.getElementById("inputStoreAddress").value = "屏東縣琉球鄉";
      document.getElementById("inputStoreHighlight").value = "海島新發現 • 必吃推薦";
      document.getElementById("inputStoreNote").value = "";

      editModal.classList.remove("hidden");
      editModal.classList.add("flex");
    });

    window.openEditModal = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      document.getElementById("formMode").value = "edit";
      document.getElementById("originalStoreId").value = s.id;
      document.getElementById("editModalHeading").textContent = `修改店家：NO.${s.id} ${s.name}`;
      document.getElementById("deleteStoreBtn").classList.remove("hidden");

      document.getElementById("inputStoreId").value = s.id;
      document.getElementById("inputStoreName").value = s.name;
      document.getElementById("inputStoreUrl").value = s.url || "";
      document.getElementById("inputStoreCategory").value = s.category;
      document.getElementById("inputPhotoUrl").value = s.imageUrl || "";
      document.getElementById("inputStorePhone").value = s.phone || "";
      document.getElementById("inputStoreHours").value = s.hours || "";
      document.getElementById("inputStoreAddress").value = s.address || "";
      document.getElementById("inputStoreHighlight").value = s.highlight || "";
      document.getElementById("inputStoreNote").value = s.note || "";

      editModal.classList.remove("hidden");
      editModal.classList.add("flex");
    };

    storeForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const mode = document.getElementById("formMode").value;
      const origId = document.getElementById("originalStoreId").value;
      const cat = document.getElementById("inputStoreCategory").value;

      const newStore = {
        id: document.getElementById("inputStoreId").value.trim(),
        name: document.getElementById("inputStoreName").value.trim(),
        url: document.getElementById("inputStoreUrl").value.trim(),
        category: cat,
        imageUrl: document.getElementById("inputPhotoUrl").value.trim(),
        phone: document.getElementById("inputStorePhone").value.trim() || "依店家公告",
        hours: document.getElementById("inputStoreHours").value.trim() || "依店家公告",
        address: document.getElementById("inputStoreAddress").value.trim() || "屏東縣琉球鄉",
        highlight: document.getElementById("inputStoreHighlight").value.trim() || "小琉球推薦",
        note: document.getElementById("inputStoreNote").value.trim() || "特色美食店家",
        emoji: cat.includes("早") ? "🌅" : cat.includes("咖") || cat.includes("甜") ? "🍧" : cat.includes("夜") || cat.includes("酒") ? "🍹" : "🍽️"
      };

      if (mode === "add") {
        foodStores.push(newStore);
      } else {
        const idx = foodStores.findIndex(item => item.id === origId);
        if (idx !== -1) foodStores[idx] = newStore;
        else foodStores.push(newStore);
      }

      localStorage.setItem(STORAGE_KEY_STORES, JSON.stringify(foodStores));
      editModal.classList.add("hidden");
      renderCategories();
      renderCards();
    });

    document.getElementById("deleteStoreBtn").addEventListener("click", () => {
      const origId = document.getElementById("originalStoreId").value;
      if (confirm("確定要刪除這個店家嗎？")) {
        foodStores = foodStores.filter(item => item.id !== origId);
        localStorage.setItem(STORAGE_KEY_STORES, JSON.stringify(foodStores));
        editModal.classList.add("hidden");
        renderCategories();
        renderCards();
      }
    });

    document.getElementById("restoreDefaultBtn").addEventListener("click", () => {
      if (confirm("確定要還原為最初的預設資料與分類名稱嗎？")) {
        foodStores = JSON.parse(JSON.stringify(defaultFoodStores));
        categories = JSON.parse(JSON.stringify(defaultCategories));
        localStorage.setItem(STORAGE_KEY_STORES, JSON.stringify(foodStores));
        localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(categories));
        renderCategories();
        renderCards();
      }
    });

    document.getElementById("closeEditModal").onclick = () => editModal.classList.add("hidden");
    document.getElementById("cancelEditBtn").onclick = () => editModal.classList.add("hidden");

    window.openPhotoModal = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      document.getElementById("photoModalTitle").textContent = s.name;
      document.getElementById("modalDescription").textContent = s.note;
      document.getElementById("modalHours").textContent = s.hours;
      document.getElementById("modalPhone").textContent = s.phone;
      document.getElementById("modalPhone").href = `tel:${s.phone}`;
      document.getElementById("modalFoodImg").src = s.imageUrl || "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80";
      document.getElementById("photoModal").classList.remove("hidden");
      document.getElementById("photoModal").classList.add("flex");
    };

    window.openMapModal = function(id) {
      const s = foodStores.find(item => item.id === id);
      if (!s) return;
      document.getElementById("mapModalTitle").textContent = s.name;
      document.getElementById("mapModalAddress").textContent = s.address;
      document.getElementById("googleMapIframe").src = `https://maps.google.com/maps?q=${encodeURIComponent(s.address)}&output=embed`;
      document.getElementById("mapModal").classList.remove("hidden");
      document.getElementById("mapModal").classList.add("flex");
    };

    document.getElementById("closePhotoModal").onclick = () => document.getElementById("photoModal").classList.add("hidden");
    document.getElementById("closeMapModal").onclick = () => document.getElementById("mapModal").classList.add("hidden");

    document.getElementById("searchInput").oninput = (e) => {
      searchQuery = e.target.value;
      renderCards();
    };

    document.getElementById("resetFilterBtn").onclick = () => {
      currentCategory = "all";
      searchQuery = "";
      document.getElementById("searchInput").value = "";
      renderCategories();
      renderCards();
    };

    renderCategories();
    renderCards();
  </script>
</body>
</html>
