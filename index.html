<!DOCTYPE html>
<html lang="zh-Hant">

      background-size: cover;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(186, 230, 253, 0.9);
      --text-primary: #0f172a;
      --header-text: #ffffff;
      --header-sub: #bae6fd;
      --panel-bg: rgba(15, 23, 42, 0.6);
      --panel-border: rgba(255, 255, 255, 0.25);
    }

    body[data-theme="sunny-beach"] {
      background: linear-gradient(rgba(245, 158, 11, 0.3), rgba(2, 132, 199, 0.6)),

      background-size: cover;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-border: rgba(253, 224, 71, 0.8);
      --text-primary: #1e293b;
      --header-text: #0f172a;
      --header-sub: #1e3a8a;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(217, 119, 6, 0.3);
    }

    body[data-theme="deep-starry"] {
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(2, 6, 23, 0.95)),

      --header-text: #f8fafc;
      --header-sub: #7dd3fc;
      --panel-bg: rgba(30, 41, 59, 0.78);
      --panel-border: rgba(56, 189, 248, 0.3);

    body[data-theme="mint-breeze"] {

      --header-sub: #99f6e4;
      --panel-bg: rgba(6, 78, 59, 0.65);
      --panel-border: rgba(45, 212, 191, 0.4);

      --card-bg: #ffffff;
      --card-border: #e5dec9;
      --text-primary: #292524;
      --header-text: #1c1917;
      --header-sub: #57534e;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: #d6d3d1;
    }

    .food-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-primary);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.25);
    }

    .theme-header-title { color: var(--header-text); }
    .theme-header-sub { color: var(--header-sub); }
    .theme-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(12px);
    }

    @keyframes swimTurtle1 {
      0% { transform: translate(-120px, 60vh) rotate(15deg) scale(0.8); opacity: 0; }
      20% { opacity: 0.25; }
      80% { opacity: 0.25; }
      100% { transform: translate(110vw, 15vh) rotate(-15deg) scale(1); opacity: 0; }
    }

      0% { transform: translate(110vw, 75vh) rotate(-20deg) scale(0.85); opacity: 0; }
      20% { opacity: 0.2; }
      80% { opacity: 0.2; }
      100% { transform: translate(-120px, 25vh) rotate(20deg) scale(0.75); opacity: 0; }
    }

    .turtle-swimming-1 {
      position: absolute;
      animation: swimTurtle1 26s linear infinite;
      pointer-events: none;
    }

    .turtle-swimming-2 {
      position: absolute;
      animation: swimTurtle2 32s linear infinite;
      pointer-events: none;
    }

      { id: "16", name: "小琉球在地風味餐館", category: "正餐", address: "屏東縣琉球鄉民生路", phone: "08-8611498", hours: "10:00–17:00", note: "道地小琉球家常海味料理。", highlight: "在地漁村風味 • 午間推薦", emoji: "🐟" },
      { id: "17", name: "東港往返小琉球客船/交通", category: "交通選項", address: "屏東縣東港鎮朝隆路（東港碼頭）", phone: "08-832-5806", hours: "07:00–17:00（依船班為主）", note: "從台灣本島東港搭乘交通船前往小琉球白沙港或大福港的最主要方式。", highlight: "本島對渡 • 航程約 25-30 分鐘", emoji: "🚢" },
      { id: "18", name: "島上機車出租 / 環島交通", category: "交通選項", address: "屏東縣琉球鄉白沙港周邊", phone: "各店家公告", hours: "08:00–18:00", note: "抵達小琉球後最便利的代步工具，環島與前往各景點必備。", highlight: "自由行必備 • 機動性高", emoji: "🛵" },
      { id: "19", name: "花瓶岩風景區", category: "景觀選項", address: "屏東縣琉球鄉本漁路起(白沙國小旁)", phone: "全天開放", hours: "全天開放", note: "小琉球最著名的地標景觀，獨特的珊瑚礁岩與清澈見底的海水，常有海龜出沒。", highlight: "地標景觀 • 浮潛與看海龜勝地", emoji: "🪨" },
      { id: "20", name: "美人洞風景區", category: "景觀選項", address: "屏東縣琉球鄉美人路", phone: "08-861-3051", hours: "07:30–17:30", note: "依山傍海的天然海蝕洞景觀，沿途步道視野遼闊，欣賞壯麗海岸線的好去處。", highlight: "天然海蝕洞 • 壯麗海景步道", emoji: "🌊" },
      { id: "21", name: "厚石群礁與落日亭", category: "景觀選項", address: "屏東縣琉球鄉環島公路南段", phone: "全天開放", hours: "全天開放", note: "沿岸綿延的壯觀裙狀珊瑚礁，更是觀賞夕陽西下與夜晚星空的絕佳祕境。", highlight: "絕美夕陽 • 珊瑚礁海岸秘境", emoji: "🌅" }
    ];

    let favorites = JSON.parse(localStorage.getItem(STORAGE_KEY_FAVS)) || [];
    let currentCategory = "all";
    let searchQuery = "";

    // 渲染分類按鈕
    function renderCategories() {
      const container = document.getElementById("categoryFilterContainer");
      if (!container) return;

      let html = `<button type="button" data-cat="all" class="cat-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold ${currentCategory === 'all' ? 'bg-sky-500 text-white shadow' : 'bg-white/85 text-slate-700'} shadow-sm">全部 (${foodStores.length})</button>`;

      categories.forEach(cat => {
        const isActive = currentCategory === cat;
        html += `
          <button type="button" data-cat="${cat}" class="cat-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold ${isActive ? 'bg-sky-500 text-white shadow' : 'bg-white/85 text-slate-700'} shadow-sm">
            ${cat}
          </button>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll(".cat-btn").forEach(btn => {
        btn.onclick = () => {
          currentCategory = btn.dataset.cat;
          renderCategories();
          renderCards();
        };
      });
    }

    // 點擊名稱直接開啟 Google 搜尋
    window.handleNameClick = function(name) {
      const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(name + " 小琉球")}`;
      window.open(searchUrl, "_blank");
    };

    // 切換最愛狀態
    window.toggleFavorite = function(id) {
      const index = favorites.indexOf(id);
      if (index > -1) {
        favorites.splice(index, 1);
      } else {
        favorites.push(id);
      }
      localStorage.setItem(STORAGE_KEY_FAVS, JSON.stringify(favorites));
      renderCards();
      renderItinerary();
    };

    // 開啟單點地圖燈箱
    window.openCustomMap = function(title, address) {
      document.getElementById("mapModalTitle").textContent = title;
      const query = encodeURIComponent(`${title} ${address}`);
      document.getElementById("googleMapIframe").src = `https://maps.google.com/maps?q=${query}&output=embed&z=17`;
      const mapModal = document.getElementById("mapModal");
      if (mapModal) {
        mapModal.classList.remove("hidden");
        mapModal.classList.add("flex");
      }
    };

    // 開啟 Google 地圖官方多點標記檢視（直接在新分頁開啟，保證完美呈現所有紅色大頭針標記點，絕無多餘導航線）
    window.openMultiRouteMap = function() {
      if (favorites.length === 0) return;
      
      let waypoints = [{ name: "小琉球海天一色", address: "屏東縣琉球鄉" }];
      favorites.forEach(id => {
        const item = foodStores.find(s => s.id === id);
        if (item) waypoints.push({ name: item.name, address: item.address });
      });

      // 使用 Google Maps 的搜尋標記網址，會直接在地圖上精準標註每一個勾選的據點紅點
      const queryStr = waypoints.map(w => `${w.name}`).join(" ");
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("小琉球 " + queryStr)}` ;
      
      window.open(mapsUrl, "_blank");
    };

    // 渲染今日行程摘要與統一導航位址
    function renderItinerary() {
      const listEl = document.getElementById("itineraryList");
      const countEl = document.getElementById("itineraryCount");
      const navContainer = document.getElementById("itineraryNavContainer");
      const navList = document.getElementById("itineraryNavList");
      const multiNavBtn = document.getElementById("multiNavBtn");
      if (!listEl || !countEl || !navContainer || !navList || !multiNavBtn) return;

      countEl.textContent = `已選擇 ${favorites.length} 個項目`;

      if (favorites.length === 0) {
        listEl.innerHTML = `<p class="text-slate-400 italic">尚未勾選任何行程，請在下方卡片點選「加入今日行程」來標記您的指定據點！</p>`;
        navContainer.classList.add("hidden");
        navList.innerHTML = "";
        multiNavBtn.classList.add("hidden");
        return;
      }

      multiNavBtn.classList.remove("hidden");

      let tagsHtml = "";
      let navHtml = "";

      favorites.forEach(id => {
        const item = foodStores.find(s => s.id === id);
        if (item) {
          tagsHtml += `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500 text-white font-bold text-xs shadow-sm">
            <span>${item.emoji || '📌'}</span>
            <span>${item.name}</span>
            <button type="button" onclick="toggleFavorite('${item.id}')" class="ml-1 hover:text-rose-200 font-bold">×</button>
          </span>`;

          navHtml += `<div class="bg-white/90 p-3 rounded-xl border flex items-center justify-between text-xs text-slate-800 shadow-sm">
            <div>
              <p class="font-black text-sky-700">${item.emoji || '📌'} ${item.name}</p>
              <p class="text-slate-500 truncate max-w-[220px] sm:max-w-xs">📍 ${item.address}</p>
            </div>
            <button type="button" onclick="openCustomMap('${item.name}', '${item.address}')" class="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-bold shrink-0 hover:bg-sky-700 transition">📍 查看標記</button>
          </div>`;
        }
      });

      listEl.innerHTML = tagsHtml;
      navList.innerHTML = navHtml;
      navContainer.classList.remove("hidden");
    }

    // 渲染卡片
    function renderCards() {
      const grid = document.getElementById("foodGrid");
      if (!grid) return;

      const filtered = foodStores.filter(s => {
        const matchCat = currentCategory === "all" || s.category === currentCategory;
        const q = searchQuery.toLowerCase();
        const matchQuery = !q || s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });

      const countEl = document.getElementById("resultCount");
      if (countEl) countEl.textContent = `目前顯示 ${filtered.length} / ${foodStores.length} 個項目`;
      
      const emptyEl = document.getElementById("emptyState");
      if (emptyEl) emptyEl.classList.toggle("hidden", filtered.length > 0);

      grid.innerHTML = filtered.map(s => {
        const isFav = favorites.includes(s.id);
        return `
          <article class="food-card rounded-3xl p-5 sm:p-6 flex flex-col justify-between shadow-lg">
            <div>
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1 rounded-full text-xs font-black bg-sky-600 text-white">NO.${s.id}</span>
                  <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800">${s.emoji || '🍽️'} ${s.category}</span>
                </div>
                <button type="button" onclick="toggleFavorite('${s.id}')" class="px-3 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-sm ${isFav ? 'bg-rose-500 text-white' : 'bg-slate-200/80 text-slate-700 hover:bg-slate-300'}">
                  <span>${isFav ? '❤️ 已排入行程' : '🤍 加入今日行程'}</span>
                </button>
              </div>
              
              <h3 class="text-lg font-black mb-2 cursor-pointer hover:underline text-sky-700 dark:text-sky-300" onclick="handleNameClick('${s.name}')">
                ${s.name} 🔍
              </h3>

              <p class="text-xs font-bold mb-2 opacity-95">✨ ${s.highlight || '小琉球推薦'}</p>
              <p class="text-sm opacity-90 mb-4">${s.note}</p>
            </div>
            <div class="pt-3 border-t text-xs space-y-1">
              <p class="opacity-80">🕒 ${s.hours || '依公告為主'}</p>
              <p class="opacity-80">📞 <a href="tel:${s.phone}" class="text-sky-600 font-bold hover:underline">${s.phone || '依公告為主'}</a></p>
              <p class="text-emerald-700 dark:text-emerald-400 font-bold cursor-pointer hover:underline" onclick="openCustomMap('${s.name}', '${s.address}')">📍 ${s.address}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    // 主題切換
    const themeButtons = document.querySelectorAll("[data-theme-btn]");
    function applyTheme(themeName) {
      document.body.setAttribute("data-theme", themeName);
      themeButtons.forEach(btn => {
        btn.classList.remove("ring-2", "ring-white", "scale-105", "shadow-lg");
        if (btn.getAttribute("data-theme-btn") === themeName) {
          btn.classList.add("ring-2", "ring-white", "scale-105", "shadow-lg");
        }
      });
      localStorage.setItem(STORAGE_KEY_THEME, themeName);
    }

    themeButtons.forEach(btn => {
      btn.addEventListener("click", () => applyTheme(btn.getAttribute("data-theme-btn")));
    });

    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
    if (savedTheme) applyTheme(savedTheme);

    // 關閉地圖燈箱
    const closeMap = document.getElementById("closeMapModal");
    if (closeMap) closeMap.onclick = () => document.getElementById("mapModal").classList.add("hidden");

    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
      searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderCards();
      };
    }

    const resetFilter = document.getElementById("resetFilterBtn");
    if (resetFilter) {
      resetFilter.onclick = () => {
        currentCategory = "all";
        searchQuery = "";
        if (searchInput) searchInput.value = "";
        renderCategories();
        renderCards();
      };
    }

    // 初始化
    renderCategories();
    renderCards();
    renderItinerary();
  </script>
</body>
</html>
